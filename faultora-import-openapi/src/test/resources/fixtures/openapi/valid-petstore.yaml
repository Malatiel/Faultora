openapi: "3.0.3"
info:
  title: Payment Service API
  description: A simple payment processing API for testing
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.example.com
    description: Production server

paths:
  /payments:
    get:
      operationId: list-payments
      summary: List all payments
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Maximum number of payments to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
      security:
        - bearerAuth: []

    post:
      operationId: create-payment
      summary: Create a new payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - bearerAuth: []

  /payments/{paymentId}:
    get:
      operationId: get-payment
      summary: Get a payment by ID
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          description: Payment not found
      security:
        - bearerAuth: []

    delete:
      operationId: delete-payment
      summary: Delete a payment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Payment deleted
        "404":
          description: Payment not found
      security:
        - bearerAuth: []

components:
  schemas:
    Payment:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [pending, completed, failed]

    CreatePaymentRequest:
      type: object
      properties:
        amount:
          type: integer
        currency:
          type: string
        idempotency-key:
          type: string
      required:
        - amount
        - currency

    PaymentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        total:
          type: integer

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: JWT bearer token
