apiVersion: faultora.dev/v1alpha1
kind: Scenario

metadata:
  name: payment-eventual-settlement
  description: >-
    A payment settles asynchronously. The scenario creates one payment,
    then polls it until the API reports it as settled, and fails if the
    convergence budget is spent first.
  labels:
    team: payments
    suite: reliability

timeout: 1m

execute:
  - id: create-payment
    type: operation
    operationId: create-payment
    outputAs: created
    inputs:
      body:
        amount: 3300
        currency: EUR

  - id: settlement-visible
    type: eventually
    timeout: 10s
    interval: 200ms
    dependsOn: [create-payment]
    steps:
      - id: poll-payment
        type: operation
        operationId: get-payment
        inputs:
          paymentId: "{{steps.created.body.id}}"
    until:
      - assertionType: status
        params:
          expected: 200
        message: the payment stays readable while it settles
      - assertionType: jsonpath
        params:
          path: status
          equals: settled
        message: settlement completes asynchronously

assertions:
  - id: created-pending
    assertionType: jsonpath
    targetStep: create-payment
    params:
      path: status
      equals: pending
    message: A fresh payment is not settled yet

  - id: final-read-is-settled
    assertionType: jsonpath
    targetStep: poll-payment
    params:
      path: status
      equals: settled
    message: The last poll observed the settled payment
