apiVersion: faultora.dev/v1alpha1
kind: Scenario
metadata:
  name: payment-create-wrong-status
  description: Create a payment but assert wrong status code (deliberately fails)

execute:
  - id: create-payment
    type: operation
    operationId: create-payment
    inputs:
      amount: 100
      currency: EUR
    timeout: 10s

assertions:
  - id: assert-wrong-status
    assertionType: status
    targetStep: create-payment
    params:
      expected: 200

cleanup: []
