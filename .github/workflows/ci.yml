name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    # GitHub evicts caches unused for 7 days. A daily dependency-check keeps the
    # NVD database warm, so the release gate fetches only recent changes instead
    # of the whole database.
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Check qualification report gate
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Strict Linux qualification
        run: |
          started="$(date +%s)"
          ./mvnw clean verify -Pstrict-qualification -B
          python3 -B scripts/verify_qualification.py --since "$started"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: '**/target/surefire-reports/'

  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: faultora-odc-database
      cancel-in-progress: false
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      # The CVSS base score at and above which a finding blocks, the same here
      # and in the release gate. Waivers live in .github/vulnerability-exceptions.json.
      VULNERABILITY_THRESHOLD: '7.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Get UTC date
        if: env.NVD_API_KEY != ''
        id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"
      - name: Restore Dependency Check database
        if: env.NVD_API_KEY != ''
        id: odc-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .odc-data
          key: odc-${{ runner.os }}-12.2.2-${{ steps.date.outputs.value }}
          restore-keys: |
            odc-${{ runner.os }}-12.2.2-
      - name: OWASP Dependency Check
        run: |
          if [ -z "${NVD_API_KEY}" ]; then
            echo "::warning::Skipping OWASP Dependency Check because NVD_API_KEY is not configured"
            exit 0
          fi
          ./mvnw install -DskipTests -B
          ./mvnw org.owasp:dependency-check-maven:12.2.2:aggregate \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DdataDirectory="${{ github.workspace }}/.odc-data" \
            -DnvdValidForHours=24 \
            -DnvdMaxRetryCount=5 \
            -Dformats=HTML,JSON \
            -B
      - name: Save Dependency Check database
        if: success() && env.NVD_API_KEY != '' && steps.odc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .odc-data
          key: odc-${{ runner.os }}-12.2.2-${{ steps.date.outputs.value }}
      # After the cache is saved: a finding must not stop the database from
      # staying warm for the next run and for the release gate.
      - name: Vulnerability gate
        if: env.NVD_API_KEY != ''
        run: >
          python3 -B scripts/vulnerability_gate.py
          --report target/dependency-check-report.json
          --threshold "${VULNERABILITY_THRESHOLD}"
          --exceptions .github/vulnerability-exceptions.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.NVD_API_KEY != ''
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: warn

  secret-scan:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  format-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - run: ./mvnw spotless:check -B
