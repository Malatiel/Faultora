name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: faultora-odc-database
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Build and verify
        run: ./mvnw install -B

      - name: Get UTC date
        id: date
        run: echo "value=$(date -u +%Y%m%d)" >> "${GITHUB_OUTPUT}"

      - name: Restore Dependency Check database
        id: odc-cache
        uses: actions/cache/restore@v5
        with:
          path: .odc-data
          key: odc-${{ runner.os }}-12.2.2-${{ steps.date.outputs.value }}
          restore-keys: |
            odc-${{ runner.os }}-12.2.2-

      - name: Dependency vulnerability scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          test -n "${NVD_API_KEY}" || {
            echo "NVD_API_KEY repository secret is required"
            exit 1
          }
          ./mvnw org.owasp:dependency-check-maven:12.2.2:aggregate \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DdataDirectory="${{ github.workspace }}/.odc-data" \
            -DnvdValidForHours=24 \
            -DnvdMaxRetryCount=5 \
            -Dformats=HTML,JSON \
            -B

      - name: Save Dependency Check database
        if: success() && steps.odc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .odc-data
          key: odc-${{ runner.os }}-12.2.2-${{ steps.date.outputs.value }}

      # Blocks the release: a finding at or above the threshold stops it unless
      # .github/vulnerability-exceptions.json waives it with owner, reason and
      # an expiry that has not passed. Same threshold as CI.
      - name: Dependency vulnerability gate
        env:
          VULNERABILITY_THRESHOLD: '7.0'
        run: >
          python3 -B scripts/vulnerability_gate.py
          --report target/dependency-check-report.json
          --threshold "${VULNERABILITY_THRESHOLD}"
          --exceptions .github/vulnerability-exceptions.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: warn

      - name: Generate CycloneDX SBOM
        run: >
          ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
          -DoutputFormat=json
          -DoutputName=faultora-${VERSION}-sbom
          -DincludeBomSerialNumber=false
          -DincludeTestScope=false
          -B

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "faultora-cli/target/faultora-${VERSION}.jar" dist/
          cp "faultora-cli/target/faultora-${VERSION}.zip" dist/
          cp "faultora-cli/target/faultora-${VERSION}.tar.gz" dist/
          cp "target/faultora-${VERSION}-sbom.json" dist/
          cp LICENSE dist/
          cd dist
          sha256sum "faultora-${VERSION}.jar" "faultora-${VERSION}.zip" \
            "faultora-${VERSION}.tar.gz" "faultora-${VERSION}-sbom.json" LICENSE > SHA256SUMS

      - name: Attest release artifacts
        if: github.event.repository.private == false
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          "dist/faultora-${VERSION}.jar"
          "dist/faultora-${VERSION}.zip"
          "dist/faultora-${VERSION}.tar.gz"
          "dist/faultora-${VERSION}-sbom.json"
          dist/LICENSE
          dist/SHA256SUMS
          --verify-tag
          --generate-notes
