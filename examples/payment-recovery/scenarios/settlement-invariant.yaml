apiVersion: faultora.dev/v1alpha1
kind: Scenario

metadata:
  name: settlement-invariant
  description: >-
    The claim the whole product is for: a command entered over HTTP causes an
    event on a broker and a booking in a database, and the three agree.

    A request creates a payment; the outbox relay publishes the settle command;
    the consumer books the ledger and announces what it booked. The scenario
    then asserts something no single request could have told it — that the two
    ledger entries sum to zero, and that the amount sitting in the database is
    the amount the API accepted.
  labels:
    team: payments
    suite: reliability

timeout: 2m

execute:
  - id: request-payment
    type: operation
    operationId: request-payment
    outputAs: requested
    inputs:
      body:
        paymentId: "pay-{{run.seed}}"
        amount: 2500
        currency: EUR

  # The event side. This only establishes that the workflow reached the
  # broker; what was booked is read from the database afterwards.
  - id: settlement-announced
    type: eventually
    timeout: 60s
    interval: 1s
    dependsOn: [request-payment]
    steps:
      - id: poll-events
        type: operation
        operationId: paymentSettled
        inputs:
          match:
            payload:
              paymentId: "pay-{{run.seed}}"
          waitMs: 1000
          maxMessages: 5
    until:
      - assertionType: event-count
        params:
          min: 1
        message: the settlement event eventually appears

  # The ledger, read through an observation the operator declared. The poll
  # above proves the event arrived; the booking is committed before the event
  # is sent, so by now it is there.
  - id: read-ledger
    type: operation
    operationId: ledger-entries-for
    dependsOn: [settlement-announced]
    inputs:
      paymentId: "pay-{{run.seed}}"

  - id: read-payment-row
    type: operation
    operationId: payment-state
    dependsOn: [settlement-announced]
    inputs:
      paymentId: "pay-{{run.seed}}"

assertions:
  - id: the-ledger-balances
    assertionType: row-balance
    targetStep: read-ledger
    params:
      column: amount
      equals: 0
    message: >-
      The entries booked for this payment sum to zero. A ledger that does not
      has lost or invented money, and no single request can tell you that.

  - id: one-booking-two-entries
    assertionType: row-count
    targetStep: read-ledger
    params:
      equals: 2
    message: One settlement books exactly two entries

  # The cross-component comparison itself: the amount the API accepted, read
  # back out of the database. The parameter is an expression, so no assertion
  # type had to be invented for the pairing.
  - id: the-database-holds-what-the-api-accepted
    assertionType: row-value
    targetStep: read-ledger
    params:
      column: amount
      row: 0
      equals: "{{steps.requested.body.amount}}"
    message: The receivable entry carries the amount the API accepted

  - id: the-payment-is-settled
    assertionType: row-value
    targetStep: read-payment-row
    params:
      column: status
      equals: settled
    message: The payment the API accepted is settled in the database

  # Both entries were booked straight through, so neither carries a provider
  # reference. Two rows with no value are not duplicates of each other — SQL
  # says a NULL equals nothing, and a unique index agrees.
  - id: no-two-entries-share-a-provider-reference
    assertionType: row-unique
    targetStep: read-ledger
    params:
      column: provider_reference
    message: No two entries claim the same provider charge

  - id: the-event-carries-its-correlation
    assertionType: event-correlation
    targetStep: poll-events
    params:
      by: header:correlation-id
    message: Every settlement event carries the correlation of its payment
