apiVersion: faultora.dev/v1
kind: Scenario

metadata:
  name: payment-concurrent-duplicate
  description: >-
    Two clients send create-payment at the same time with the same
    Idempotency-Key while injected latency widens the race window. The
    business invariant: exactly one payment exists afterwards, and both
    clients receive a payment.
  labels:
    team: payments
    suite: reliability

inputs:
  idempotency-key:
    type: string
    description: Key shared by both concurrent requests
    required: false
    defaultValue: race-demo-001

faults:
  - id: sync-delay
    faultType: http-latency
    targetScope: "*"
    duration: 10s
    params:
      delayMs: 150

execute:
  - id: race
    type: parallel
    dependsOn: [sync-delay]
    steps:
      - id: first-client
        type: operation
        operationId: create-payment
        outputAs: first
        inputs:
          headers:
            Idempotency-Key: "{{inputs.idempotency-key}}"
          body:
            amount: 7700
            currency: EUR
      - id: second-client
        type: operation
        operationId: create-payment
        outputAs: second
        inputs:
          headers:
            Idempotency-Key: "{{inputs.idempotency-key}}"
          body:
            amount: 7700
            currency: EUR

  - id: list-payments
    type: operation
    operationId: list-payments
    dependsOn: [race]

assertions:
  - id: first-client-got-a-payment
    assertionType: jsonpath
    targetStep: first-client
    params:
      path: "id"
      exists: true
    message: The first client receives a payment either way

  - id: second-client-got-a-payment
    assertionType: jsonpath
    targetStep: second-client
    params:
      path: "id"
      exists: true
    message: The second client receives a payment either way

  - id: exactly-one-payment
    assertionType: jsonpath
    targetStep: list-payments
    params:
      path: "@"
      count: 1
    message: Concurrent requests with one idempotency key create exactly one payment
